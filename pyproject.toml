[tool.poetry]
name = "osp-nce"
version = "0.1.0"
description = "Extension review automation tool for the UW Office of Sponsored Programs."
authors = [
    "Sid Gurajala <sgurajala99@gmail.com>",
    "Edoouard Seryozhenkov <edouas@uw.edu>"
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13,<4"
streamlit = ">=1.41.1,<2.0.0"
pandas = ">=2.2.3,<3.0.0"
logger = ">=1.4,<2.0"
sqlalchemy = ">=2.0.37,<3.0.0"
fastapi = ">=0.115.6,<0.116.0"
uvicorn = ">=0.34.0,<0.35.0"
pymssql = ">=2.3.2,<3.0.0"
pypdf2 = ">=3.0.1,<4.0.0"
reportlab = ">=4.2.5,<5.0.0"
msal = ">=1.31.1,<2.0.0"
openpyxl = ">=3.1.5,<4.0.0"
numpy = ">=2.2.2,<3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-mock = "^3.11"
pytest-cov = "^4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = "src"
addopts = "-v"

[tool.black]
line-length = 88
