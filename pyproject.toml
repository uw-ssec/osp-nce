[tool.poetry]
name = "osp_nce"
version = "0.1.0"
description = "Extension review automation tool for the UW Office of Sponsored Programs."
authors = [
    "Sid Gurajala <sgurajala99@gmail.com>",
    "Edoouard Seryozhenkov <edouas@uw.edu>",
    "Apoorva Sheera <asheera@uw.edu>",
    "Daniel Vogler <dvogler@uw.edu>",
]
packages = [{ include = "osp_nce", from = "src"}]
include = [
    "src/osp_nce/backend/queries/*.sql",
    "src/osp_nce/shared/templates/*.pdf",
    "src/osp_nce/shared/templates/*.json"
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10, <3.11"
streamlit = ">=1.41.1,<2.0.0"
pandas = ">=2.2.3,<3.0.0"
logger = ">=1.4,<2.0"
sqlalchemy = ">=2.0.37,<3.0.0"
fastapi = ">=0.115.6,<0.116.0"
uvicorn = ">=0.34.0,<0.35.0"
pymssql = "2.2.11"
pypdf2 = ">=3.0.1,<4.0.0"
reportlab = ">=4.2.5,<5.0.0"
msal = ">=1.31.1,<2.0.0"
openpyxl = ">=3.1.5,<4.0.0"
numpy = ">=2.2.2,<3.0.0"
dotenv = "^0.9.9"
pymupdf = "^1.25.3"
langchain-community = "^0.3.19"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-mock = "^3.11"
pytest-cov = "^4.0"
ruff = "^0.9.9"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = "src"
addopts = "-v"

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "I",   # isort
    "ANN", # flake8 type annotations
    "RUF", # ruff-specific rules
]
fixable = ["ALL"]
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"
